name: API image
on:
  push:
    branches: [main]
    paths:
      - "apps/sales360-crm/backend/**"
      - "apps/sales360-crm/frontend/package.json"
      - "deploy/Dockerfile.api"
      - "deploy/start-api.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".dockerignore"
      - "LICENSE"
      - "NOTICE"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux image
        run: docker build -f deploy/Dockerfile.api --label org.opencontainers.image.source=https://github.com/${{ github.repository }} -t apaas-sales360-crm-api:${{ github.sha }} .
      - name: Export image
        run: docker save apaas-sales360-crm-api:${{ github.sha }} | gzip -1 > api-image.tar.gz
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to GHCR
        run: |
          docker tag apaas-sales360-crm-api:${{ github.sha }} ghcr.io/${{ github.repository }}-api:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}-api:${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: api-image-${{ github.sha }}
          path: api-image.tar.gz
          if-no-files-found: error
          retention-days: 7
