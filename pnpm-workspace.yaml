packages:
  - "apps/*/backend"
  - "apps/*/frontend"
overrides:
  multer: 2.4.0
  deepmerge-ts: 8.0.2
onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - "esbuild"
  - "prisma"
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
