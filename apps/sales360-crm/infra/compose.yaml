services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: crm_dev
      POSTGRES_PASSWORD: crm_dev_local
      POSTGRES_DB: sales360
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - sales360_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_dev -d sales360"]
      interval: 3s
      retries: 10
volumes:
  sales360_pgdata:
