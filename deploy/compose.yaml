name: apaas-sales360-crm
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run node scripts/init-local.mjs}
      POSTGRES_DB: sales360
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U crm -d sales360"]
      interval: 5s
      retries: 20
  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    environment:
      DATABASE_URL: postgresql://crm:${DB_PASSWORD}@db:5432/sales360?schema=public
      HOST: 0.0.0.0
      PORT: "4301"
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:4300}
      CRM_BOOTSTRAP_EMAIL: ${ADMIN_EMAIL:?Missing ADMIN_EMAIL}
      CRM_BOOTSTRAP_PASSWORD: ${ADMIN_PASSWORD:?Missing ADMIN_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4301/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
  web:
    build: { context: .., dockerfile: deploy/Dockerfile.web }
    ports: ["127.0.0.1:${WEB_PORT:-4300}:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
volumes:
  db-data:
